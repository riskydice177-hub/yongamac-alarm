name: yongamac-alarm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: yongamac
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 이전 상태 불러오기
        uses: actions/cache@v4
        with:
          path: yongamac_state.json
          key: yongamac-state-${{ github.run_id }}
          restore-keys: yongamac-state-

      - name: 예매 오픈 확인
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CGV_SITE_NO: "0013"
          CGV_THEATER_NAME: "용아맥"
          CGV_FORMATS: "IMAX,아이맥스"
          CGV_DAYS_AHEAD: "21"
          CGV_HOT_PER_CYCLE: "30"
          PYTHONUTF8: "1"
        run: python yongamac_alarm.py --once
